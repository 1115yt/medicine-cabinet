name: Android and Worker checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests, lint, and builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create temporary CI debug signing key
        run: |
          mkdir -p .local
          keytool -genkeypair -v \
            -keystore .local/debug.keystore \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run tests, lint, and compile APK variants
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest \
            lintDebug lintPreview lintRelease \
            assemblePreview assembleRelease \
            -PsplitApks=true

  worker:
    name: Cloudflare Worker local tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.5

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test using local simulated D1
        run: pnpm test
