name: Android and Worker checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests, lint, and builds
    runs-on: ubuntu-latest
    outputs:
      unsigned-artifact: ${{ steps.package.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create temporary CI debug signing key
        run: |
          mkdir -p .local
          keytool -genkeypair -v \
            -keystore .local/debug.keystore \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run tests, lint, and compile APK variants
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest \
            lintDebug lintPreview lintRelease \
            assembleRelease \
            -PsplitApks=true

      - name: Test APK validation and signing helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_apks.py'

      - name: Name unsigned APK handoff
        id: package
        if: >-
          github.repository == '1115yt/medicine-cabinet' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: echo "name=unsigned-apks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Save unsigned APKs for the signing job
        if: steps.package.outputs.name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
            app/build/outputs/apk/release/app-universal-release-unsigned.apk
            app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  worker:
    name: Cloudflare Worker local tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.5

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test using local simulated D1
        run: pnpm test

  signed-apk:
    name: Signed installable APKs
    needs: [android, worker]
    if: >-
      github.repository == '1115yt/medicine-cabinet' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      artifact: ${{ steps.package.outputs.name }}
    steps:
      - name: Check out the tested source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install signing and inspection tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download only this run's unsigned APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.android.outputs.unsigned-artifact }}
          path: ${{ runner.temp }}/unsigned-apks

      - name: Validate APKs and release version
        id: validate
        run: |
          python3 .github/scripts/release_apks.py validate \
            --input-dir "$RUNNER_TEMP/unsigned-apks" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0"

      # 发行密钥只提供给签名步骤；编译、PR 检查和缓存均不接触它。
      - name: Sign and verify using the fixed release certificate
        env:
          MEDICINE_RELEASE_KEYSTORE_BASE64: ${{ secrets.MEDICINE_RELEASE_KEYSTORE_BASE64 }}
          MEDICINE_RELEASE_STORE_PASSWORD: ${{ secrets.MEDICINE_RELEASE_STORE_PASSWORD }}
        run: |
          python3 .github/scripts/release_apks.py sign \
            --input-dir "$RUNNER_TEMP/unsigned-apks" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --output-dir "$RUNNER_TEMP/installable-apks"

      - name: Name installable APK download
        id: package
        run: echo "name=installable-apks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Save installable APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ runner.temp }}/installable-apks/*.apk
            ${{ runner.temp }}/installable-apks/SHA256SUMS.txt
            ${{ runner.temp }}/installable-apks/build-info.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  release:
    name: Publish tagged release
    needs: [signed-apk]
    if: >-
      github.repository == '1115yt/medicine-cabinet' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      !startsWith(github.ref, 'refs/tags/v0.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release validation helper
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download this run's verified installable APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.signed-apk.outputs.artifact }}
          path: ${{ runner.temp }}/installable-apks

      - name: Publish APKs to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.signed-apk.outputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          python3 -c 'import os, sys; sys.path.insert(0, ".github/scripts"); from release_apks import is_formal_version; sys.exit(0 if is_formal_version(os.environ["RELEASE_VERSION"]) else "正式版从 v1.0.0 开始，末位按十次进位")'
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')
          test "$remote_commit" = "$GITHUB_SHA"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "该版本已存在，请核对现有 Release；本工作流不会覆盖历史安装包。" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/installable-apks"
          sha256sum --check SHA256SUMS.txt
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          家庭药箱正式发行版。

          - arm64-v8a 安装包适合多数现代 Android 手机；不确定架构时请选择 universal 通用包。
          - 沿用固定发行签名，已安装同签名发行版可覆盖更新。
          - 原预览版签名不同，换装前请先导出药箱备份。
          - SHA256SUMS.txt 提供安装包校验值，build-info.json 记录版本、提交及公开证书指纹。
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "家庭药箱 $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            ./*.apk SHA256SUMS.txt build-info.json
